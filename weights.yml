# weights.yml — Multi-factor 점수 가중치 (신규 스키마)
# Task 6 이후: 잠재력 점수 5 factor (본질 매력도) + 기회 점수는 regret_scorer 에서 직접 관리
#
# 잠재력 점수 factor (종목 본질):
#   - momentum_3m: 3개월(60봉) 누적 수익률 (중기 추세)
#   - regime_score: 시장 국면 (BULL/BEAR 자동 분포 shift)
#   - roe: ROE (수익성, STOCK 전용)
#   - per: PER (저평가, STOCK 전용, lower_better)
#   - liquidity: 유동성 (시총×거래대금, cross-sectional rank)
#
# 기회 점수 factor: regret_scorer.py 에서 직접 관리
#   - bull_reward (40%) / max_drawdown (20%) / dist_to_stop (15%) / signal_freshness (25%)
#   - R:R 75% + freshness 25%
priorities:
  - key: momentum_3m
    label: 가격 모멘텀 (3개월)
    weight: 35.0
    direction: higher_better
    applies_to_pools: [STOCK, ETN_ETF]

  - key: regime_score
    label: 시장 국면
    weight: 15.0
    direction: higher_better
    applies_to_pools: [STOCK, ETN_ETF]

  - key: roe
    label: ROE (수익성)
    weight: 15.0
    direction: higher_better
    applies_to_pools: [STOCK]

  - key: per
    label: PER (저평가)
    weight: 10.0
    direction: lower_better
    applies_to_pools: [STOCK]

  - key: liquidity
    label: 유동성
    weight: 25.0
    direction: higher_better
    applies_to_pools: [STOCK, ETN_ETF]

must_have: []

strategy_weights:
  # timing-study 백테스트 실측 tier (2026-05-18):
  #   Tier A (1.4): strategy_five — avg 12.56%/win 71% (morning, 3일 보유, rank_bucket=1)
  #   Tier A (1.3): strategy_three — avg 11.38%/win 72% (morning, 3일 보유, rank_bucket=1)
  #   Tier B (1.1): strategy_four — confluence 핵 (단독은 중간)
  #   Tier A (1.3): strategy_one — 표본 부족 (6건/win 100%), 사용자 판단으로 상향 (2026-05-18)
  #   Tier D (0.8): strategy_two — walk-forward -0.06% (손익분기)
  # r1/r2 fallback 은 base 와 동일 tier
  strategy_five_bull_flag: 1.4
  strategy_five_bull_flag_1h: 1.4
  strategy_five_bull_flag_30m: 1.4
  strategy_three_trend_following: 1.3
  strategy_three_1h: 1.3
  strategy_three_30m: 1.3
  strategy_four_pullback_ma: 1.1
  strategy_four_pullback_ma_1h: 1.1
  strategy_four_pullback_ma_30m: 1.1
  strategy_one_d_v2: 1.3
  strategy_one_w_v2: 1.3
  strategy_one_1h_v2: 1.3
  strategy_one_30m_v2: 1.3
  strategy_one_d_v2_r1: 1.3
  strategy_one_d_v2_r2: 1.3
  strategy_one_w_v2_r1: 1.3
  strategy_one_w_v2_r2: 1.3
  strategy_one_1h_v2_r1: 1.3
  strategy_one_1h_v2_r2: 1.3
  strategy_one_30m_v2_r1: 1.3
  strategy_one_30m_v2_r2: 1.3
  strategy_two_cross_sectional_momentum: 0.8
  strategy_two_1h: 0.8
  strategy_two_30m: 0.8

# Phase 3 (2026-05-19): Regime-Conditional Parameter Optimization
# 매칭 우선순위:
#   1. 시장 regime 3-label (market_regime.get_regime_label): BULL / NEUTRAL / BEAR
#   2. per-ticker regime 7-label (per_ticker_regime): UPTREND_STRONG, RANGE_TIGHT, ... MIXED
# runner._build_unique_pool 은 현재 1번 (3-label) 만 호출. 7-label 은 per-ticker 시스템 확장용.
# regime 미지정 또는 등록 안 된 strategy 는 위 strategy_weights 로 fallback.
# weight 0.0 = 해당 regime 에서 전략 신호 무시.
strategy_weights_by_regime:
  # 인버스 ETF(이름에 "인버스")는 ensemble 에서 regime 행을 반전 적용 (BULL↔BEAR,
  # UPTREND↔DOWNTREND) — core/decision/ensemble.py invert_regime(). 시장 하락이 호황.
  # ----- 3-label (시장 전체 regime, runner 활성) -----
  BULL:
    # score >= 70 — 강세장. 추세 추종 강화, mean reversion 약화
    # _r1/_r2 는 조회 키가 정확 일치라 명시하지 않으면 정적 strategy_weights(1.3) 로
    # fallback 된다. 실제 후보를 내는 id 이므로 base 와 같은 값을 적는다.
    strategy_one_d_v2: 0.6
    strategy_one_d_v2_r1: 0.6
    strategy_one_d_v2_r2: 0.6
    strategy_two_cross_sectional_momentum: 1.4
    strategy_three_trend_following: 1.4
    strategy_four_pullback_ma: 1.2
    strategy_five_bull_flag: 1.4
  NEUTRAL:
    # 30 <= score < 70 — 평형. 정적 strategy_weights 와 유사 + 추세 약간 약화
    strategy_one_d_v2: 1.1
    strategy_one_d_v2_r1: 1.1
    strategy_one_d_v2_r2: 1.1
    strategy_two_cross_sectional_momentum: 0.9
    strategy_three_trend_following: 0.8
    strategy_four_pullback_ma: 1.0
    strategy_five_bull_flag: 0.8
  BEAR:
    # score < 30 — 약세. 모두 약화, bull flag 차단
    strategy_one_d_v2: 0.7
    strategy_one_d_v2_r1: 0.7
    strategy_one_d_v2_r2: 0.7
    strategy_two_cross_sectional_momentum: 0.3
    strategy_three_trend_following: 0.4
    strategy_four_pullback_ma: 0.5
    strategy_five_bull_flag: 0.0

  # ----- 7-label (per-ticker, 향후 확장용) -----
  UPTREND_STRONG:
    strategy_one_d_v2: 0.5
    strategy_two_cross_sectional_momentum: 1.5
    strategy_three_trend_following: 1.5
    strategy_four_pullback_ma: 1.3
    strategy_five_bull_flag: 1.5
  UPTREND_WEAK:
    strategy_one_d_v2: 0.8
    strategy_two_cross_sectional_momentum: 1.3
    strategy_three_trend_following: 1.2
    strategy_four_pullback_ma: 1.3
    strategy_five_bull_flag: 1.2
  RANGE:
    strategy_one_d_v2: 1.2
    strategy_two_cross_sectional_momentum: 0.7
    strategy_three_trend_following: 0.3
    strategy_four_pullback_ma: 1.0
    strategy_five_bull_flag: 0.5
  RANGE_TIGHT:
    strategy_one_d_v2: 1.3
    strategy_two_cross_sectional_momentum: 0.5
    strategy_three_trend_following: 0.2
    strategy_four_pullback_ma: 0.8
    strategy_five_bull_flag: 0.4
  DOWNTREND_WEAK:
    strategy_one_d_v2: 0.8
    strategy_two_cross_sectional_momentum: 0.3
    strategy_three_trend_following: 0.5
    strategy_four_pullback_ma: 0.5
    strategy_five_bull_flag: 0.0
  DOWNTREND_STRONG:
    strategy_one_d_v2: 0.0
    strategy_two_cross_sectional_momentum: 0.0
    strategy_three_trend_following: 0.0
    strategy_four_pullback_ma: 0.0
    strategy_five_bull_flag: 0.0
  MIXED:
    strategy_one_d_v2: 0.7
    strategy_two_cross_sectional_momentum: 0.7
    strategy_three_trend_following: 0.7
    strategy_four_pullback_ma: 0.7
    strategy_five_bull_flag: 0.5
